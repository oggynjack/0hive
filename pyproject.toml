[project]
name = "0hive"
version = "1.0.0"
description = "A self-healing, multi-account OpenAI-compatible gateway for Gemini's web app, with an account-sync toolkit and a live dashboard. Built on gemini-web2api."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
streaming = ["httpx>=0.25"]
sync = ["playwright>=1.40"]

[project.scripts]
0hive = "gemini_web2api:main"

[tool.setuptools]
py-modules = ["gemini_web2api", "account_manager", "db", "metrics", "dashboard"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
