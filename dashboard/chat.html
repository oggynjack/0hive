<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0Hive - Test Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
        .header { padding: 16px 24px; background: #12121a; border-bottom: 1px solid #2a2a3a; display: flex; align-items: center; gap: 16px; }
        .header h1 { font-size: 18px; font-weight: 600; color: #fff; }
        .header .model-select { background: #1a1a2a; border: 1px solid #3a3a4a; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
        .header .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #888; }
        .header .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
        .header .status-dot.offline { background: #ef4444; }
        .chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; position: relative; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.5; word-break: break-word; }
        .message.user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
        .message.assistant { align-self: flex-start; background: #1a1a2a; border: 1px solid #2a2a3a; border-bottom-left-radius: 4px; }
        .message.error { background: #1a0a0a; border: 1px solid #3a1a1a; color: #f87171; }
        .message pre { background: #0a0a12; padding: 12px; border-radius: 8px; overflow-x: auto; margin-top: 8px; font-size: 13px; }
        .message code { font-family: 'SF Mono', Monaco, monospace; }
        .message .msg-image { max-width: 100%; max-height: 300px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: transform 0.2s; }
        .message .msg-image:hover { transform: scale(1.02); }
        .message.user .msg-image { border: 2px solid rgba(255,255,255,0.2); }
        .message.assistant .msg-image { border: 1px solid #3a3a4a; }

        /* Input area */
        .input-area { padding: 16px 24px; background: #12121a; border-top: 1px solid #2a2a3a; display: flex; flex-direction: column; gap: 8px; }
        .input-row { display: flex; gap: 12px; align-items: flex-end; }

        /* Image preview strip */
        .image-preview-strip { display: none; gap: 8px; padding: 8px 0 4px 0; flex-wrap: wrap; }
        .image-preview-strip.active { display: flex; }
        .image-preview-item { position: relative; width: 72px; height: 72px; border-radius: 8px; overflow: hidden; border: 2px solid #3a3a4a; flex-shrink: 0; }
        .image-preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .image-preview-item .remove-btn { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; background: rgba(0,0,0,0.7); border: none; border-radius: 50%; color: #fff; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
        .image-preview-item .remove-btn:hover { background: #ef4444; }

        .input-area textarea { flex: 1; background: #1a1a2a; border: 1px solid #3a3a4a; color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 15px; resize: none; font-family: inherit; min-height: 48px; max-height: 150px; }
        .input-area textarea:focus { outline: none; border-color: #2563eb; }
        .input-area .btn-row { display: flex; gap: 8px; }
        .input-area button { background: #2563eb; color: #fff; border: none; padding: 12px 24px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .input-area button:hover { background: #1d4ed8; }
        .input-area button:disabled { background: #374151; cursor: not-allowed; }
        .btn-attach { background: #1a1a2a !important; border: 1px solid #3a3a4a !important; padding: 10px 14px !important; font-size: 18px !important; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
        .btn-attach:hover { background: #2a2a3a !important; border-color: #5a5a6a !important; }

        /* Drag & drop overlay */
        .drop-overlay { display: none; position: absolute; inset: 0; background: rgba(37, 99, 235, 0.15); border: 3px dashed #2563eb; border-radius: 12px; z-index: 100; pointer-events: none; }
        .drop-overlay.active { display: flex; align-items: center; justify-content: center; }
        .drop-overlay-text { background: #12121a; padding: 16px 32px; border-radius: 12px; font-size: 16px; font-weight: 600; color: #2563eb; border: 1px solid #2563eb; }

        /* Fullscreen image viewer */
        .image-viewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; cursor: zoom-out; }
        .image-viewer.active { display: flex; }
        .image-viewer img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }

        /* Typing animation */
        .typing { display: flex; gap: 4px; padding: 12px 16px; }
        .typing span { width: 8px; height: 8px; background: #4a4a5a; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* ── Responsive: tablet ───────────────────────────────────────── */
        @media (max-width: 900px) {
            .chat-container { padding: 18px; }
            .message { max-width: 88%; }
        }
        /* ── Responsive: mobile ───────────────────────────────────────── */
        @media (max-width: 640px) {
            html { -webkit-text-size-adjust: 100%; }
            .header { padding: 10px 12px; gap: 8px; flex-wrap: wrap; }
            .header h1 { font-size: 15px; }
            .header .model-select { font-size: 13px; padding: 6px 8px; max-width: 42vw; }
            .header .status { font-size: 11px; gap: 5px; }
            .chat-container { padding: 12px; gap: 12px; }
            .message { max-width: 94%; font-size: 14px; padding: 10px 13px; }
            .input-area { padding: 10px 12px; }
            .input-row { gap: 8px; }
            .input-area textarea { padding: 10px 12px; font-size: 16px; min-height: 42px; } /* 16px stops iOS auto-zoom on focus */
            .input-area button { padding: 10px 16px; font-size: 14px; }
            .btn-attach { min-width: 40px; min-height: 40px; padding: 8px 10px !important; }
            .image-preview-item { width: 56px; height: 56px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ðŸ”® 0Hive</h1>
        <a href="dashboard.html" style="color:#6ea8ff;text-decoration:none;font-size:13px;">&larr; Dashboard</a>
        <select class="model-select" id="model">
            <option value="gemini-auto">gemini-auto (recommended)</option>
        </select>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Checking...</span>
        </div>
    </div>
    <div class="chat-container" id="chat">
        <div class="drop-overlay" id="dropOverlay">
            <div class="drop-overlay-text">ðŸ“¸ Drop image here</div>
        </div>
    </div>
    <div class="input-area">
        <div class="image-preview-strip" id="imagePreviewStrip"></div>
        <div class="input-row">
            <textarea id="input" placeholder="Type a message... (paste or drag an image)" rows="1"></textarea>
            <div class="btn-row">
                <button class="btn-attach" id="attachBtn" title="Attach image (or paste / drag-and-drop)">ðŸ“Ž</button>
                <button id="send" onclick="send()">Send</button>
            </div>
        </div>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
    <div class="image-viewer" id="imageViewer" onclick="closeViewer()">
        <img id="viewerImg" src="">
    </div>

    <script>
        const API_BASE = /0code\.uk$/.test(window.location.hostname)
            ? 'https://gemini.0code.uk'
            : (window.location.protocol + '//' + (window.location.hostname || 'localhost') + ':8081');
        const API_URL = API_BASE + '/v1/chat/completions';
        const API_KEY = 'sk-gemini';
        let messages = [];
        let sending = false;
        let attachedImages = []; // {dataUrl, base64, mimeType, name}

        const input = document.getElementById('input');
        const fileInput = document.getElementById('fileInput');
        const attachBtn = document.getElementById('attachBtn');
        const previewStrip = document.getElementById('imagePreviewStrip');
        const dropOverlay = document.getElementById('dropOverlay');
        const chatContainer = document.getElementById('chat');

        // â”€â”€ Auto-resize textarea â”€â”€
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 150) + 'px';
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        // â”€â”€ File picker â”€â”€
        attachBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
            fileInput.value = '';
        });

        // â”€â”€ Paste from clipboard â”€â”€
        input.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    e.preventDefault();
                    const file = item.getAsFile();
                    if (file) handleFiles([file]);
                    return;
                }
            }
        });
        // Also listen on the whole document so paste works when input isn't focused
        document.addEventListener('paste', (e) => {
            if (document.activeElement === input) return; // handled above
            const items = e.clipboardData?.items;
            if (!items) return;
            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    e.preventDefault();
                    const file = item.getAsFile();
                    if (file) handleFiles([file]);
                    return;
                }
            }
        });

        // â”€â”€ Drag & drop â”€â”€
        chatContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (e.dataTransfer.types.includes('Files')) {
                dropOverlay.classList.add('active');
            }
        });
        chatContainer.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!chatContainer.contains(e.relatedTarget)) {
                dropOverlay.classList.remove('active');
            }
        });
        chatContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropOverlay.classList.remove('active');
            const files = e.dataTransfer.files;
            if (files.length) handleFiles(files);
        });
        // Also allow drop on the input area
        document.querySelector('.input-area').addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
        });
        document.querySelector('.input-area').addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropOverlay.classList.remove('active');
            const files = e.dataTransfer.files;
            if (files.length) handleFiles(files);
        });

        // â”€â”€ Process image files â”€â”€
        function handleFiles(files) {
            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;
                if (attachedImages.length >= 5) { alert('Maximum 5 images per message.'); break; }
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const dataUrl = ev.target.result;
                    // dataUrl looks like data:image/png;base64,ABC...
                    const [header, base64] = dataUrl.split(',');
                    const mimeType = header.match(/:(.*?);/)[1] || 'image/png';
                    attachedImages.push({ dataUrl, base64, mimeType, name: file.name });
                    renderPreviews();
                };
                reader.readAsDataURL(file);
            }
        }

        function renderPreviews() {
            previewStrip.innerHTML = '';
            if (attachedImages.length === 0) {
                previewStrip.classList.remove('active');
                return;
            }
            previewStrip.classList.add('active');
            attachedImages.forEach((img, idx) => {
                const item = document.createElement('div');
                item.className = 'image-preview-item';
                item.innerHTML = `<img src="${img.dataUrl}" alt="${img.name}"><button class="remove-btn" title="Remove">&times;</button>`;
                item.querySelector('.remove-btn').addEventListener('click', () => {
                    attachedImages.splice(idx, 1);
                    renderPreviews();
                });
                previewStrip.appendChild(item);
            });
        }

        // -- API status + live model list (never hardcoded, always what the server actually offers today) --
        let modelsLoaded = false;
        async function checkStatus() {
            try {
                const resp = await fetch(API_BASE + '/v1/models', {
                    headers: { 'Authorization': 'Bearer ' + API_KEY }
                });
                const dot = document.getElementById('statusDot');
                const text = document.getElementById('statusText');
                if (resp.ok) {
                    dot.className = 'status-dot';
                    text.textContent = 'Connected';
                    if (!modelsLoaded) {
                        const data = await resp.json();
                        const sel = document.getElementById('model');
                        const ids = (data.data || []).map(m => m.id);
                        if (ids.length) {
                            const prev = sel.value;
                            sel.innerHTML = ids.map(id => '<option value="' + id + '">' + id + '</option>').join('');
                            if (ids.includes(prev)) sel.value = prev;
                            else if (ids.includes('gemini-auto')) sel.value = 'gemini-auto';
                            modelsLoaded = true;
                        }
                    }
                } else {
                    dot.className = 'status-dot offline';
                    text.textContent = 'Error ' + resp.status;
                }
            } catch (e) {
                document.getElementById('statusDot').className = 'status-dot offline';
                document.getElementById('statusText').textContent = 'Offline';
            }
        }
        checkStatus();
        setInterval(checkStatus, 30000);

        // â”€â”€ Message rendering â”€â”€
        function addMessage(role, content, imageDataUrls) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'message ' + role;

            // Show image thumbnails if present
            if (imageDataUrls && imageDataUrls.length) {
                for (const url of imageDataUrls) {
                    const img = document.createElement('img');
                    img.className = 'msg-image';
                    img.src = url;
                    img.onclick = () => openViewer(url);
                    div.appendChild(img);
                }
            }

            if (content) {
                const textNode = document.createElement('span');
                textNode.textContent = content;
                div.appendChild(textNode);
            }

            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        function showTyping() {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'typing';
            div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typing');
            if (el) el.remove();
        }

        // â”€â”€ Image viewer â”€â”€
        function openViewer(url) {
            document.getElementById('viewerImg').src = url;
            document.getElementById('imageViewer').classList.add('active');
        }
        function closeViewer() {
            document.getElementById('imageViewer').classList.remove('active');
        }

        // â”€â”€ Send â”€â”€
        async function send() {
            if (sending) return;
            const text = input.value.trim();
            if (!text && attachedImages.length === 0) return;

            sending = true;
            document.getElementById('send').disabled = true;

            // Capture images for this message
            const imagesForMsg = attachedImages.map(i => ({ ...i }));
            const imageDataUrls = imagesForMsg.map(i => i.dataUrl);

            // Build message content
            let msgContent;
            if (imagesForMsg.length > 0) {
                msgContent = [];
                if (text) {
                    msgContent.push({ type: 'text', text: text });
                }
                for (const img of imagesForMsg) {
                    msgContent.push({
                        type: 'image_url',
                        image_url: { url: `data:${img.mimeType};base64,${img.base64}` }
                    });
                }
            } else {
                msgContent = text;
            }

            // Clear input and images
            input.value = '';
            input.style.height = 'auto';
            attachedImages = [];
            renderPreviews();

            // Show in chat
            addMessage('user', text, imageDataUrls);

            // Push to conversation history
            messages.push({ role: 'user', content: msgContent });

            showTyping();

            try {
                const resp = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + API_KEY
                    },
                    body: JSON.stringify({
                        model: document.getElementById('model').value,
                        messages: messages,
                        max_tokens: 4096
                    })
                });

                const data = await resp.json();
                removeTyping();

                if (data.error) {
                    addMessage('error', 'Error: ' + (data.error.message || JSON.stringify(data.error)));
                } else if (data.choices && data.choices[0]) {
                    const content = data.choices[0].message.content;
                    messages.push({ role: 'assistant', content: content });
                    addMessage('assistant', content);
                } else {
                    addMessage('error', 'Unexpected response: ' + JSON.stringify(data).slice(0, 500));
                }
            } catch (e) {
                removeTyping();
                addMessage('error', 'Network error: ' + e.message);
            }

            sending = false;
            document.getElementById('send').disabled = false;
            input.focus();
        }
    </script>
</body>
</html>
